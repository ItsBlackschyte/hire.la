name: enrich-companies

# Offices (Wikidata → company website → OpenStreetMap) and logos (ATS board
# page → website → Wikidata → verified guess) for every company, on GitHub's
# servers. Weekly, plus one-click manual runs. Commits new logo files back.
#
# Safe to re-run: offices only retries placeholders not tried in 60 days;
# logos only processes companies without one (unless force_logos).

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      run_offices:
        description: "Find real office locations"
        type: boolean
        default: true
      hq_only:
        description: "Offices: HQ rows only (fast). Off = every placeholder incl. branch offices (long, use GitHub for this)"
        type: boolean
        default: false
      retry_all:
        description: "Offices: re-attempt rows already tried in the last 60 days"
        type: boolean
        default: false
      run_logos:
        description: "Fetch logos"
        type: boolean
        default: true
      force_logos:
        description: "Logos: re-fetch even for companies that already have one"
        type: boolean
        default: false
      limit:
        description: "Offices: max locations to try (0 = all)"
        default: "0"

concurrency:
  group: hire-la-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find office locations
        if: ${{ github.event_name == 'schedule' || inputs.run_offices }}
        run: |
          ARGS=""
          if [ "${{ inputs.hq_only }}" = "true" ]; then ARGS="$ARGS --hq-only"; fi
          if [ "${{ inputs.retry_all }}" = "true" ]; then ARGS="$ARGS --retry-all"; fi
          if [ "${{ inputs.limit || '0' }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          npm run offices -- $ARGS

      - name: Fetch logos
        if: ${{ github.event_name == 'schedule' || inputs.run_logos }}
        run: |
          if [ "${{ inputs.force_logos }}" = "true" ]; then
            npm run logos -- --force
          else
            npm run logos
          fi

      - name: Commit logos back to the repo
        run: |
          git config user.name "hire-la-bot"
          git config user.email "bot@hire.la"
          git add public/logos data/logos-missing.json scripts/.geocode-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "enrich: $(date -u +%Y-%m-%d) — offices + logos"
            git push
          fi
