name: fetch-jobs

on:
  schedule:
    # 03:00 and 15:00 UTC — twice daily; also keeps the Supabase free
    # project from pausing for inactivity.
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      geocode_budget:
        description: "Max geocoder lookups this run (raise for onboarding batches)"
        default: "800"
      poi_lookup:
        description: "Look up real office locations in OpenStreetMap (1 = on)"
        default: "0"

# Never overlap with the onboarding workflow.
concurrency:
  group: hire-la-worker
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingestion worker
        run: npx tsx worker/fetch-jobs.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEOCODE_BUDGET: ${{ github.event.inputs.geocode_budget || '800' }}
          POI_LOOKUP: ${{ github.event.inputs.poi_lookup || '0' }}
