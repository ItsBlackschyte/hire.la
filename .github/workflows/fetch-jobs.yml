name: fetch-jobs

on:
  schedule:
    # 03:00 and 15:00 UTC — twice daily; also keeps the Supabase free
    # project from pausing for inactivity.
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingestion worker
        run: npx tsx worker/fetch-jobs.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
